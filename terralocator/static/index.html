<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerraLocator</title>
<link rel="stylesheet" href="/leaflet/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; background: #10121a; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; top: 56px; bottom: 0; left: 0; right: 0; background: #10121a; }
  #topbar {
    height: 56px; background: #151826; color: #eef; display: flex; align-items: center;
    padding: 0 12px; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); position: relative; z-index: 1000;
  }
  #topbar strong { font-size: 15px; }
  #fix-status { font-size: 13px; color: #9aa; flex: 1; }
  #fix-status.ok { color: #4dd0e1; }
  #fix-status.bad { color: #ff6b6b; }
  button {
    background: #2a2c3b; color: #eef; border: none; border-radius: 6px; padding: 8px 12px;
    font-size: 13px; cursor: pointer;
  }
  button:hover { background: #343751; }
  #nav-panel {
    position: absolute; left: 12px; bottom: 12px; background: rgba(21,24,38,0.92); color: #eef;
    padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: 280px; display: none; z-index: 1000;
  }
  #nav-panel.visible { display: block; }
  #disclaimer {
    position: absolute; right: 12px; bottom: 12px; background: rgba(120, 40, 20, 0.9); color: #fff;
    padding: 8px 12px; border-radius: 8px; font-size: 11px; max-width: 260px; z-index: 1000; display: none;
  }
  #disclaimer.visible { display: block; }
  #empty-state {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(21,24,38,0.97); color: #eef; padding: 18px 22px; border-radius: 12px;
    font-size: 14px; max-width: 360px; text-align: center; z-index: 1000; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #empty-state.visible { display: block; }
  #empty-state button {
    margin-top: 10px; background: #3d5afe; color: white; border: none; border-radius: 6px;
    padding: 8px 16px; cursor: pointer; font-size: 13px;
  }
  .hazard-danger { color: #ff6b6b; }
  .hazard-safe_zone { color: #66d17a; }
  .hazard-police { color: #6ea8ff; }
  .hazard-poi { color: #ffca28; }
</style>
</head>
<body>
  <div id="topbar">
    <strong>TerraLocator</strong>
    <span id="fix-status">Getting location…</span>
    <button id="btn-refresh">Refresh fix</button>
    <button id="btn-clear-target">Clear destination</button>
  </div>
  <div id="map"></div>
  <div id="empty-state"></div>
  <div id="nav-panel"></div>
  <div id="disclaimer"></div>

  <script src="/leaflet/leaflet.js"></script>
  <script src="/map.js"></script>
</body>
</html>
